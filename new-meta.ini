[custom]
; ==============================================================================
; OpenClash 极致精细分流完整模板（含全套默认策略组 + 完整规则 + 应用独立手动选择）
; 适配：Fake-IP (TUN-混合) 模式 + gVisor 网络栈
; ==============================================================================

; 1. 基础策略组（Proxy Groups）配置
custom_proxy_group=🎯 全球直连`direct``
custom_proxy_group=🔮 漏网之余`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]``
custom_proxy_group=🐟 漏网兜底`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]``

; 常用国家/地区自动测速节点池
custom_proxy_group=🇭🇰 香港节点`url-test`[auto_regex*]^(?:.*)(香港|HK|Hong Kong)(?:.*)$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇹🇼 台湾节点`url-test`[auto_regex*]^(?:.*)(台湾|TW|Taiwan)(?:.*)$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇯🇵 日本节点`url-test`[auto_regex*]^(?:.*)(日本|JP|Japan)(?:.*)$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇸🇬 新加坡节点`url-test`[auto_regex*]^(?:.*)(新加坡|SG|Singapore)(?:.*)$`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇸 美国节点`url-test`[auto_regex*]^(?:.*)(美国|US|United States)(?:.*)$`http://www.gstatic.com/generate_204`300
custom_proxy_group=♻️ 自动选择`url-test`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`http://www.gstatic.com/generate_204`300
custom_proxy_group=🛠️ 手动选择`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]``

; 各大主流应用的“手动 + 自动”组合策略组（支持自由指定节点或自动测速）
custom_proxy_group=✈️ Telegram 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🇭🇰 香港节点`🇹🇼 台湾节点`🇯🇵 日本节点`🇸🇬 新加坡节点`🇺🇸 美国节点`♻️ 自动选择`🛠️ 手动选择
custom_proxy_group=🤖 OpenAI 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🇺🇸 美国节点`🇯🇵 日本节点`🇸🇬 新加坡节点`🇭🇰 香港节点`🇹🇼 台湾节点`♻️ 自动选择`🛠️ 手动选择
custom_proxy_group=📹 YouTube 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🇭🇰 香港节点`🇹🇼 台湾节点`🇯🇵 日本节点`🇸🇬 新加坡节点`🇺🇸 美国节点`♻️ 自动选择`🛠️ 手动选择
custom_proxy_group=🌐 Google 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🇭🇰 香港节点`🇹🇼 台湾节点`🇯🇵 日本节点`🇸🇬 新加坡节点`🇺🇸 美国节点`♻️ 自动选择`🛠️ 手动选择
custom_proxy_group=🎥 Netflix 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🇸🇬 新加坡节点`🇯🇵 日本节点`🇭🇰 香港节点`🇹🇼 台湾节点`🇺🇸 美国节点`♻️ 自动选择`🛠️ 手动选择
custom_proxy_group=🍏 Apple 手动`select`[auto_regex*]^[香港|台湾|日本|新加坡|美国]`🎯 全球直连`♻️ 自动选择`🛠️ 手动选择

; 2. 规则集（Rules）配置：严格按“小应用在上、大平台在下”排序，防止串流
rules=AND,((DOMAIN-SUFFIX,telegram.org),(DST-PORT,443)),✈️ Telegram 手动
rules=DOMAIN-KEYWORD,t.me,✈️ Telegram 手动
rules=DOMAIN-KEYWORD,telegram,✈️ Telegram 手动

rules=DOMAIN-SUFFIX,openai.com,🤖 OpenAI 手动
rules=DOMAIN-SUFFIX,auth0.com,🤖 OpenAI 手动

rules=DOMAIN-SUFFIX,googlevideo.com,📹 YouTube 手动
rules=DOMAIN-SUFFIX,youtube.com,📹 YouTube 手动
rules=DOMAIN,youtubei.googleapis.com,📹 YouTube 手动

rules=DOMAIN-SUFFIX,netflix.com,🎥 Netflix 手动
rules=DOMAIN-SUFFIX,nflxvideo.net,🎥 Netflix 手动

rules=DOMAIN-SUFFIX,apple.com,🍏 Apple 手动
rules=DOMAIN-SUFFIX,icloud.com,🍏 Apple 手动

rules=DOMAIN-SUFFIX,google.com,🌐 Google 手动
rules=DOMAIN,googleapis.com,🌐 Google 手动
rules=DOMAIN,gstatic.com,🌐 Google 手动

; 基础直连与兜底策略
rules=GEOIP,CN,🎯 全球直连
rules=MATCH,🔮 漏网之余
